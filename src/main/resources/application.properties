spring.application.name=leaderboard

# PostgreSQL (native install). Set DB_PASSWORD in your environment; never commit it.
spring.datasource.url=jdbc:postgresql://localhost:5432/${DB_NAME:leaderboard}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.sql.init.mode=always

# Redis (docker compose)
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Virtual threads so 1000+ concurrent requests aren't capped by the Tomcat thread pool
spring.threads.virtual.enabled=true

management.endpoints.web.exposure.include=health,metrics

# Local learning project: show error causes in responses
server.error.include-message=always
server.error.include-exception=true
